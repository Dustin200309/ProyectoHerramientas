<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Herramientas</title>
</head>
<body>
  <body>

    <div class="container">
        <div class="container-form">
          <form class="sign-in">
            <h2>Iniciar Sesión</h2>
            <div class="social-networks">
                <ion-icon name="logo-twitch" role="img" class="md hydrated"></ion-icon>
                <ion-icon name="logo-twitter" role="img" class="md hydrated"></ion-icon>
                <ion-icon name="logo-instagram" role="img" class="md hydrated"></ion-icon>
                <ion-icon name="logo-tiktok" role="img" class="md hydrated"></ion-icon>
            </div>
            <span>Use su correo y contraseña</span>
            <div class="container-input">
                <ion-icon name="mail-outline" role="img" class="md hydrated"></ion-icon>
                <input type="text" placeholder="Email">
            </div>
            <div class="container-input">
                <ion-icon name="lock-closed-outline" role="img" class="md hydrated"></ion-icon>
                <input type="password" placeholder="Password">
            </div>
            <a href="">¿Olvidaste tu contraseña?</a>
            <button class="button">Iniciar Sesión</button>
          </form>
        </div>

         <div class="container-form">
            <form class="sign-in">
                <h2>Registrarse</h2>
                 <div class="social-networks">
                <ion-icon name="logo-twitch" role="img" class="md hydrated"></ion-icon>
                <ion-icon name="logo-twitter" role="img" class="md hydrated"></ion-icon>
                <ion-icon name="logo-instagram" role="img" class="md hydrated"></ion-icon>
                <ion-icon name="logo-tiktok" role="img" class="md hydrated"></ion-icon>
            </div>
            <span>Use su correo electrónico para registrarse</span>
            <div class="container-input">
                <ion-icon name="person-outline" role="img" class="md hydrated"></ion-icon>
                <input type="text" placeholder="Nombre">
            </div>
            <div class="container-input">
                <ion-icon name="mail-outline" role="img" class="md hydrated"></ion-icon>
                <input type="text" placeholder="Email">
            </div>
            <div class="container-input">
                <ion-icon name="lock-closed-outline" role="img" class="md hydrated"></ion-icon>
                <input type="password" placeholder="Password">
            </div>
            
            <button class="button">Registrarse</button>
            </form>
        </div>

    </div>

    <script src="/script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule="" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>


</body>


    
</body>
</html>
